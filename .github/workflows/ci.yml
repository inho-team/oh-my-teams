name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Documentation audit
        run: npm run quality
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
